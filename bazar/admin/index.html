<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bazar Admin Portal</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#122915">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="app" hidden></div>

<main class="login" id="login" hidden>
  <form class="login-card" id="loginForm" novalidate autocomplete="on">
    <img src="/assets/brand/logo-light.png" width="852" height="332" alt="clickfor.in Bazar" class="login-logo">
    <h1>Bazar Admin Portal</h1>
    <p class="muted">Log in to manage your products, categories and pages.</p>
    <div class="field"><label for="lu">Username</label><input id="lu" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label for="lp">Password</label>
      <div class="pw"><input id="lp" name="password" type="password" autocomplete="current-password" required><button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false">Show</button></div></div>
    <p class="form-error" id="loginError" role="alert" hidden></p>
    <button class="btn btn-orange btn-block" id="loginBtn" type="submit">Log in</button>
    <p class="muted small" style="margin-top:18px;text-align:center">This area is for the Bazar team only.</p>
  </form>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="dlg" class="dlg"></dialog>
<script src="/admin/admin.js"></script>
</body>
</html>
