<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazar product menu</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=block">
<style>
/* Printable product menu. Built live from the website's products; "Save as PDF" in the print dialog makes the file. */
@page{size:A4;margin:10mm 0 10mm}
@page :first{margin-top:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:Poppins,system-ui,sans-serif;color:#1d2b1f;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{position:sticky;top:0;z-index:9;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;background:#122915;color:#fff;font-size:14px}
.bar button{font:600 15px Poppins,sans-serif;background:#e2762b;color:#fff;border:0;border-radius:999px;padding:11px 20px;cursor:pointer}
.bar span{opacity:.85}
.sheet{width:210mm;margin:0 auto;background:#fff}
@media screen{body{background:#e9e4d6}.sheet{margin:16px auto;box-shadow:0 10px 40px -20px rgba(0,0,0,.4)}}
@media screen and (max-width:820px){.sheet{zoom:.45}}
@media print{.bar{display:none}.sheet{margin:0;box-shadow:none}}
.page{padding:0 12mm 4mm}
header{background:#17402a;color:#f7f0dc;margin:0 -12mm 5mm;padding:9mm 12mm 8mm;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-30mm;top:-30mm;width:80mm;height:80mm;border-radius:50%;background:#e2762b}
.brand small{display:block;font-weight:700;font-size:11pt}
.brand .wm{width:48mm;height:12mm;background:url(/assets/brand/wordmark-light.png) left/contain no-repeat;margin-top:1mm}
.brand b{display:block;font-weight:600;font-size:7.5pt;letter-spacing:4.2px;margin-top:1.5mm;opacity:.9}
.hd{text-align:right;position:relative;z-index:1}
.hd h1{font-weight:800;font-size:20pt;line-height:1}
.hd p{font-size:8.5pt;margin-top:2mm;opacity:.9}
.contact{display:flex;gap:6mm;justify-content:center;align-items:center;background:#f3ead2;border-radius:3mm;padding:3mm 4mm;margin-bottom:4.5mm;font-weight:600;font-size:10pt}
.contact span{display:flex;align-items:center;gap:2mm}
.contact svg{width:5mm;height:5mm}
section{margin-bottom:4.5mm}
h2{display:flex;align-items:center;gap:3mm;font-size:12.5pt;font-weight:700;color:#17402a;margin-bottom:3mm;break-after:avoid}
h2 i{flex:1;height:.4mm;background:#e0d4b4}
h2 em{font-style:normal;font-size:8pt;font-weight:500;color:#8a7a55}
.grid{display:flex;flex-wrap:wrap;gap:3.5mm}
.card{width:calc((100% - 3 * 3.5mm) / 4);display:flex;flex-direction:column;background:#fff;border:.3mm solid #ebe3cf;border-radius:3mm;overflow:hidden;break-inside:avoid}
.ph{height:29mm;padding:1.5mm;display:flex;align-items:center;justify-content:center;background:#fff}
.ph img{width:100%;height:100%;max-height:100%;object-fit:contain}
.tx{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:4mm 3.4mm 3.2mm;border-top:.3mm solid #f2ecdc}
.nm{font-weight:700;font-size:12.5pt;line-height:1.18;margin-bottom:1mm}
.ln{display:flex;justify-content:space-between;align-items:baseline;margin-top:1.6mm;gap:2mm}
.q{font-size:10pt;font-weight:500;color:#6d6650}
.pr{font-weight:800;font-size:16pt;color:#c4581a;white-space:nowrap}
.oos{display:inline-block;margin-top:1mm;font-size:8pt;font-weight:700;color:#a32;background:#fde8e4;border-radius:2mm;padding:.4mm 1.6mm}
footer{margin-top:4mm;text-align:center;font-size:8.5pt;color:#4b5a4d;border-top:.3mm solid #e0d4b4;padding-top:3.5mm}
footer b{color:#17402a}
.msg{padding:40px;text-align:center;font-size:16px}
</style>
</head>
<body>
<div class="bar"><span id="status">Preparing the menu…</span><button type="button" id="print" disabled>Save as PDF</button></div>
<div class="sheet"><div class="page" id="menu"></div></div>
<script>
(function () {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  const qty = p => [p.quantity_value, ({ piece: 'pcs' })[p.quantity_unit] || p.quantity_unit].filter(Boolean).join(' ');
  const wa = '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#25D366"/><path fill="#fff" d="M16 6.5a9.4 9.4 0 0 0-8.1 14.2L6.6 25.5l4.9-1.3A9.4 9.4 0 1 0 16 6.5zm0 17.2c-1.5 0-2.9-.4-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A7.8 7.8 0 1 1 16 23.7zm4.3-5.8c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.4 6.4 0 0 1-3.2-2.8c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.7-1.7c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6c.1.2 1.7 2.6 4.1 3.6 1.5.7 2.1.7 2.9.6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.6-.3z"/></svg>';
  const today = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  const status = document.getElementById('status'), btn = document.getElementById('print');

  fetch('/api/public?r=catalog', { cache: 'no-store' }).then(r => r.json()).then(c => {
    // Categories follow the order set in Admin → Categories.
    const sections = c.categories.map(cat => {
      const ps = c.products.filter(p => p.category && p.category.id === cat.id);
      if (!ps.length) return '';
      const cards = ps.map(p => `<div class="card"><div class="ph">${p.images[0] ? `<img src="${esc(p.images[0])}" alt="">` : ''}</div>
        <div class="tx"><div><div class="nm">${esc(p.name)}</div>${p.in_stock ? '' : '<span class="oos">Out of stock</span>'}</div>
        <div class="ln"><span class="q">${esc(qty(p))}</span><span class="pr">${money(p.price)}</span></div></div></div>`).join('');
      return `<section><h2><span>${esc(cat.name)}</span><i></i><em>${ps.length} item${ps.length > 1 ? 's' : ''}</em></h2><div class="grid">${cards}</div></section>`;
    }).join('');
    document.getElementById('menu').innerHTML = `
      <header><div class="brand"><small>clickfor.in</small><div class="wm"></div><b>ONLINE STORE</b></div>
        <div class="hd"><h1>PRODUCT MENU</h1><p>Homemade &amp; daily essentials · Milky | Salsha</p></div></header>
      <div class="contact"><span>${wa}Order on WhatsApp: 8086 7777 90</span><span>·</span><span>www.clickfor.in</span></div>
      ${sections || '<p class="msg">No products yet.</p>'}
      <footer><b>How to order:</b> send the item names and quantity on WhatsApp to <b>8086 7777 90</b>, or tap Buy on WhatsApp at <b>www.clickfor.in</b>.<br>Prices as on ${esc(today)}.</footer>`;
    document.title = 'Bazar product menu ' + today;
    // Shrink each photo to a small JPEG first, so the PDF stays light enough to send on WhatsApp.
    const shrink = src => new Promise(res => {
      const im = new Image(); im.crossOrigin = 'anonymous';
      im.onload = () => { try {
        const S = 420, k = Math.min(1, S / Math.max(im.naturalWidth, im.naturalHeight));
        const cv = document.createElement('canvas'); cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
        const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.8)); } catch (e) { res(src); } };
      im.onerror = () => res(src); im.src = src;
    });
    const imgs = [...document.querySelectorAll('.ph img')].map(i => shrink(i.src).then(u => new Promise(r => { i.onload = i.onerror = r; i.src = u; if (i.complete) r(); })));
    // Wait for photos and fonts, then open the print dialog (choose "Save as PDF").
    Promise.all([...imgs, document.fonts ? document.fonts.ready : null]).then(() => {
      status.textContent = c.products.length + ' products ready. In the print window, choose "Save as PDF".';
      btn.disabled = false;
      if (!/[?&]noprint/.test(location.search)) setTimeout(() => window.print(), 300);
    });
  }).catch(() => { status.textContent = 'Could not load products. Please check your internet and refresh.'; });

  btn.addEventListener('click', () => window.print());
})();
</script>
</body>
</html>
